[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "udfp"
version = "1.0.0"
description = "Universal Document Format Protocol — parse, transform, and render HWP/HWPX/DOCX/PDF/MD documents through a unified Document Model, with an MCP server for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Hoon Kim", email = "h000000nkim@gmail.com" },
]
keywords = ["hwp", "hwpx", "docx", "pdf", "document", "converter", "parser", "renderer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "olefile>=0.46",
    "pdfminer.six>=20221105",
    "pypdf>=3.0",
    "lxml>=4.9.0",
]

[project.urls]
Homepage = "https://github.com/h000000nkim/udfp"
Documentation = "https://github.com/h000000nkim/udfp#readme"
Repository = "https://github.com/h000000nkim/udfp"
Issues = "https://github.com/h000000nkim/udfp/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-olefile",
]
screenshot = [
    "selenium>=4.0",
    "Pillow>=9.0",
]
screenshot-gt = [
    "playwright>=1.40",
    "Pillow>=9.0",
]
mcp = [
    "mcp>=1.1.3",
]

[project.scripts]
udf = "udf.cli:main"
udfp = "udfp:main"

[tool.hatch.build.targets.wheel]
packages = ["udf", "udfp"]
artifacts = ["udf/renderers/hwp/seed/*.hwp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "workspace/",
    "output/",
    "node_modules/",
    "notebooks/",
    "scripts/",
    "sandbox/",
    "dist/",
    ".claude/",
    "CLAUDE.md",
    "CLAUDE.local.md",
    "package.json",
    "package-lock.json",
    "docs/*.pdf",
    ".gitignore",
    ".DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
exclude = ["notebooks/", "sandbox/", "scripts/"]

[tool.ruff.lint]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "olefile"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
