site_name: UDF — Universal Document Format
site_url: https://h000000nkim.github.io/udfp/
site_description: Parse, transform, and render documents across HWP, HWPX, DOCX, PDF, and Markdown through a single unified Document Model.
site_author: Hoon Kim

repo_name: h000000nkim/udfp
repo_url: https://github.com/h000000nkim/udfp

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

exclude_docs: |
  README.md
  api-reference.md

plugins:
  - search:
      lang:
        - ko
        - en
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.critic
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Document Model: guide/document-model.md
      - Format Conversion: guide/conversion.md
      - Generation Modes: guide/generation-modes.md
      - Validation: guide/validation.md
  - API Reference:
      - Overview: api/index.md
      - Top-Level Functions: api/functions.md
      - UdfDocument: api/document.md
      - DocumentBuilder: api/builder.md
      - Schema: api/schema.md
      - Validation: api/validation.md
  - CLI: cli.md
  - MCP Server: mcp.md
  - Supported Formats: formats.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/h000000nkim/udfp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/udfp/
