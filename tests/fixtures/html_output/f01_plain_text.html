<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
@font-face { font-family: '함초롬바탕'; src: local('함초롬바탕'); }
@font-face { font-family: '함초롬돋움'; src: local('함초롬돋움'); }
@font-face { font-family: '한컴돋움'; src: local('한컴돋움'); }
@font-face { font-family: '한컴바탕'; src: local('한컴바탕'); }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #e0e0e0; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
.page {
  width: 595pt;
  height: 841pt;
  margin: 0 auto 40px auto;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  overflow: hidden;
  position: relative;
  page-break-after: always;
}
.page .content {
  padding: 56pt 85pt 42pt 85pt;
  line-height: 1.6;
  font-size: 10pt;
  overflow: hidden;
}
.page .content p { margin: 0.15em 0; white-space: pre-wrap; }
.page .content h1,.page .content h2,.page .content h3,
.page .content h4,.page .content h5,.page .content h6 { margin: 0.15em 0; font-size: inherit; }
table { border-collapse: collapse; table-layout: fixed; margin: 0.4em 0; }
td, th { border: none; padding: 1pt 2pt; vertical-align: top; font-size: 10pt; }
.fn { font-size: 8pt; color: #555; margin-top: 0.4em; }
.img-left { float: left; margin: 4pt 10pt 4pt 0; }
.img-right { float: right; margin: 4pt 0 4pt 10pt; }
.img-center { display: block; margin: 8pt auto; }
.img-full { display: block; width: 100% !important; height: auto !important; margin: 8pt 0; }
.clear { clear: both; }
</style>
<style id='cmp'>body{margin:0!important;padding:0!important;background:#fff!important}.page{margin:0 0 4px 0!important;box-shadow:none!important;transform-origin:top left!important;border-bottom:2px solid red!important}</style><script>window.addEventListener('load',function(){document.querySelectorAll('.page').forEach(function(p){var s=p.parentElement.clientWidth/p.offsetWidth;if(s<1){p.style.transform='scale('+s+')';p.style.marginBottom='-'+(p.offsetHeight*(1-s))+'px'}})});</script></head>
<body>
<div class="page">
<div class="content">
<p><span style="font-size:10.0pt;font-family:'함초롬바탕','Noto Serif KR',serif">첫 번째 단락입니다.</span></p>
<p><span style="font-size:10.0pt;font-family:'함초롬바탕','Noto Serif KR',serif">두 번째 단락입니다. 조금 더 긴 텍스트를 포함합니다.</span></p>
<p><span style="font-size:10.0pt;font-family:'함초롬바탕','Noto Serif KR',serif">세 번째 단락입니다.</span></p>
<p>&nbsp;</p>
<div style="clear:both"></div>
</div>
</div>
</body>
</html>
